name: Monthly Land Registry Ingestion

on:
  schedule:
    - cron: '0 8 15 * *'  # 8am on 15th of every month
                            # Land Registry publishes ~10th-12th
                            # 15th gives buffer for publication delays
  workflow_dispatch:
    inputs:
      run_month:
        description: "Run month in YYYY-MM format"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install google-cloud-bigquery pandas pyarrow requests

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Run ingestion
        run: |
          if [ -n "${{ inputs.run_month }}" ]; then
            python ingestion/ingest_land_registry.py "${{ inputs.run_month }}"
          else
            python ingestion/ingest_land_registry.py
          fi

      # - name: Run dbt after ingestion
