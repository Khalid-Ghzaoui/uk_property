      #     pip install dbt-core dbt-bigquery
      #     cd dbt_property
      #     dbt run --profiles-dir . --vars "{run_month: '$(date -d 'last month' +%Y-%m)'}"
      #     dbt test --profiles-dir . --vars "{run_month: '$(date -d 'last month' +%Y-%m)'}"