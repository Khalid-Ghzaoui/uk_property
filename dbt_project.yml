name: 'uk_property'
version: '1.0.0'
config-version: 2

profile: 'uk_property'

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  uk_property:

    # Staging layer
    staging:
      +materialized: view

    # Intermediate models (if we add later)
    intermediate:
      +materialized: view

    # Marts layer (Power BI reads these)
    marts:
      +materialized: table
